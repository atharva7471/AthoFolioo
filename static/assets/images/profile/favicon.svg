<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Dark background gradient (matching portfolio) -->
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#0F172A"/> <!-- Deep navy -->
      <stop offset="100%" stop-color="#020617"/> <!-- Near black -->
    </linearGradient>
    
    <!-- Electric blue accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- "A" Monogram (Inverted V) -->
  <path d="M 50 20 L 20 80 L 38 80 L 50 56 L 62 80 L 80 80 Z" fill="#FFFFFF"/>
  
  <!-- Futuristic floating crossbar -->
  <polygon points="32,60 68,60 72,68 28,68" fill="url(#accent)"/>

  <!-- Technical accent dot (Top right) -->
  <circle cx="78" cy="26" r="4" fill="url(#accent)"/>
</svg>
