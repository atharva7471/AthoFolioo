{% extends "main/base.html" %}

{% block title %}Error {{ error_code }} | Atharva Bhosale{% endblock %}

{% block content %}
<section class="hero-sequence" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative;">
  <div class="hero-grid-overlay"></div>
  <div class="hero-ambient-glow" style="opacity: 0.5;"></div>
  
  <div class="container text-center" style="position: relative; z-index: 10;">
    <h1 class="chapter-headline" style="font-size: clamp(4rem, 10vw, 8rem); margin-bottom: 1rem;">
      <span class="outline-text">{{ error_code }}</span>
    </h1>
    <h2 style="font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2.5rem); margin-bottom: 2rem;">
      {{ error_title }}
    </h2>
    <p style="color: var(--color-text-secondary); max-width: 500px; margin: 0 auto 3rem; font-size: 1.1rem; line-height: 1.6;">
      {{ error_message }}
    </p>
    
    <a href="{{ url_for('home') }}" class="btn-premium" style="display: inline-flex;">
      <span class="btn-text">Return to Reality</span>
      <span class="btn-icon"><i class="bi bi-arrow-right"></i></span>
    </a>
  </div>
</section>
{% endblock %}
