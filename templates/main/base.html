<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atharva Bhosale — Digital Experience & ML Engineering." />
    <meta name="author" content="Atharva Bhosale" />
    <meta property="og:title" content="Atharva Bhosale | Digital Experience" />
    <meta property="og:description" content="An immersive journey through Machine Learning and Web Architecture." />
    <meta property="og:type" content="website" />
    <title>{% block title %}Athaarvaaa{% endblock %}</title>

    <!-- Preconnect to font and icon servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <!-- Google Fonts: non-blocking load (eliminates render-blocking cascade) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Inter:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Inter:wght@300;400;500&display=swap"></noscript>

    <!-- Bootstrap Icons: non-blocking (only needed for below-fold UI elements) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" /></noscript>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/images/profile/favicon.svg') }}" />

    <!-- Core Design System (Order matters: base → motion → components) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main/base.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main/motion.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main/cursor.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main/loader.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main/animations.css') }}?v=3">
    {% if hero_bg %}
    <!-- Preload first hero image for LCP — fetchpriority ensures it wins bandwidth race -->
    <link rel="preload" as="image" href="{{ url_for('static', filename='assets/images/' ~ hero_bg) }}" fetchpriority="high">
    {% endif %}
  </head>
  <body class="loading">

    <!-- ── Cinematic Page Loader ──────────────────────────────── -->
    <div id="page-loader" aria-hidden="true">
      <span class="loader-logo">A.</span>
      <div class="loader-count" id="loaderCount">Loading</div>
      <div class="loader-tagline">Digital Experience & ML Engineering</div>
      <div class="loader-bar-wrap">
        <div class="loader-bar" id="loaderBar"></div>
      </div>
    </div>

    <!-- ── Custom Cursor ──────────────────────────────────────── -->
    <div id="cursor-dot" aria-hidden="true"></div>
    <div id="cursor-ring" aria-hidden="true" data-label="View"></div>

    <!-- ── Navigation Header ─────────────────────────────────── -->
    <header id="global-header" class="header fixed top-0 left-0 w-full z-[9999] px-[5vw] py-4 pointer-events-none transition-all duration-[400ms] ease-fast will-change-transform [&.nav-hidden]:-translate-y-[110%] [&.nav-hidden]:opacity-0 [&.nav-hidden]:pointer-events-none [&.menu-active]:z-[99999]">
      {% include "main/partials/navbar.html" %}
    </header>

    <!-- ── Navigation Overlay ────────────────────────────────── -->
    {% include "main/partials/nav_overlay.html" %}

    <!-- ── Main Scroll Container ─────────────────────────────── -->
    <main id="smooth-wrapper">
      <div id="smooth-content">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- ── Scripts ───────────────────────────────────────────── -->
    <!-- Smooth scroll -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    <!-- GSAP Core + ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <!-- Motion Engine (all animations) — loads before app.js -->
    <script src="{{ url_for('static', filename='js/motion.js') }}?v=3"></script>
    <!-- App Logic (data: comments, modals, form) -->
    <script src="{{ url_for('static', filename='js/app.js') }}?v=3"></script>
  </body>
</html>
