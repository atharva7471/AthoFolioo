{% extends "admin/base.html" %}
{% block title %}| Edit Certificate{% endblock %}
{% block head %}
<link rel="stylesheet"
  href="{{ url_for('static', filename='css/admin/edit_project.css') }}">
{% endblock %}
{% block content %}
<section class="admin-section admin-edit-project">

  <!-- Header -->
  <div class="admin-header">
    <h2>Edit Certificate</h2>
    <a href="{{ url_for('add_cert_page') }}" class="back-btn">Back</a>
  </div>

  <!-- Form Card -->
  <div class="admin-card">
    <form method="POST" class="admin-form" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Title -->
      <div class="form-group">
        <label>Certificate Title</label>
        <input
          type="text"
          name="title"
          value="{{ cert.title }}"
          required>
      </div>

      <!-- Issuer -->
      <div class="form-group">
        <label>Issued By</label>
        <input
          type="text"
          name="issuer"
          value="{{ cert.issuer }}"
          required>
      </div>

      <div class="form-group">
        <label>Display Priority</label>
        <input
          type="number"
          name="priority"
          value="{{ cert.priority if cert.priority is not none else 100 }}"
          placeholder="Priority (e.g., 1, 2, 3...)"
          min="1"
          required>
      </div>

      <div class="form-group">
        <label>Certificate URL</label>
        <input
          type="url"
          name="certificate_url"
          value="{{ cert.certificate_url or '' }}">
      </div>
      
      <div class="form-group">
        <label>Update Photo (Leave blank to keep current)</label>
        <input
          type="file"
          name="image"
          accept="image/*">
      </div>

      <!-- Submit -->
      <div class="form-actions">
        <button type="submit" class="primary-btn">
          Update Certificate
        </button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
